pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

// Use local MTH checkout when available, fall back to JitPack otherwise.
def mthLocal = file('../mth/kotlin')
if (mthLocal.directory) {
    includeBuild(mthLocal) {
        dependencySubstitution {
            substitute module('com.github.ncmud.mth:mth-core') using project(':mth-core')
        }
    }
}

include 'BTLib'
include 'BT_Free'
